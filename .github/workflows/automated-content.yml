name: Automated content quality and merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: automated-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRODUCTION_SITE: ${{ vars.PRODUCTION_SITE || 'https://pulso-byte.vercel.app' }}

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout synthetic pull request merge
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Validate automated article scope
        if: startsWith(github.event.pull_request.head.ref, 'automation/artigo-')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${HEAD_BRANCH}" =~ ^automation/artigo-[0-9]{4}-[0-9]{2}-[0-9]{2}-(manha|noite)-[a-z0-9-]+$ ]]; then
            echo "Invalid automated article branch: ${HEAD_BRANCH}"
            exit 1
          fi

          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          mapfile -t changes < <(git diff --name-status "${BASE_SHA}" "${HEAD_SHA}")
          article_count=0
          cover_count=0
          internal_count=0
          article_path=""
          cover_path=""
          internal_paths=()

          for change in "${changes[@]}"; do
            status="${change%%$'\t'*}"
            file="${change#*$'\t'}"
            if [[ "${status}" != "A" ]]; then
              echo "Automated article PRs may only add new files: ${change}"
              exit 1
            fi
            case "${file}" in
              content/articles/*.mdx)
                article_count=$((article_count + 1)); article_path="${file}" ;;
              public/images/articles/*.webp)
                name="$(basename "${file}" .webp)"
                if [[ -f "content/articles/${name}.mdx" ]]; then
                  cover_count=$((cover_count + 1)); cover_path="${file}"
                else
                  internal_count=$((internal_count + 1)); internal_paths+=("${file}")
                fi
                ;;
              *)
                echo "File outside automated-content allowlist: ${file}"
                exit 1
                ;;
            esac
          done

          if [[ "${article_count}" -ne 1 || "${cover_count}" -ne 1 || "${internal_count}" -gt 3 ]]; then
            echo "Expected one new article, one matching WebP cover and at most three new internal images."
            exit 1
          fi

          slug="$(basename "${article_path}" .mdx)"
          [[ "${cover_path}" == "public/images/articles/${slug}.webp" ]] || {
            echo "Cover filename must match article slug."
            exit 1
          }
          grep -Eq "^slug: [\"']?${slug}[\"']?$" "${article_path}" || {
            echo "Frontmatter slug does not match filename."
            exit 1
          }

          for internal_path in "${internal_paths[@]}"; do
            public_path="/${internal_path#public/}"
            grep -Fq "${public_path}" "${article_path}" || {
              echo "Internal image is not referenced by the article: ${internal_path}"
              exit 1
            }
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate article content
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npm run validate:content

      - name: Validate article images
        run: npm run validate:images

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"

  auto-merge-automated-article:
    name: Auto-merge automated article
    needs: quality
    if: >-
      ${{
        needs.quality.result == 'success' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'automation/artigo-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: automated-content-merge-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read

    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Confirm target is the default branch
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"

          if [[ "${BASE_BRANCH}" != "${default_branch}" ]]; then
            echo "Refusing auto-merge: PR targets '${BASE_BRANCH}', but default branch is '${default_branch}'."
            exit 1
          fi

      - name: Wait for Vercel preview
        shell: bash
        run: |
          set -euo pipefail

          vercel_state() {
            local sha="$1"
            local status_states check_states combined
            status_states="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" \
                --jq '[.statuses[] | select(.context | test("vercel"; "i")) | .state] | unique | join(",")' \
                2>/dev/null || true
            )"
            check_states="$(
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
                --jq '[.check_runs[] | select(.name | test("vercel"; "i")) | if .status != "completed" then .status else (.conclusion // "missing") end] | unique | join(",")' \
                2>/dev/null || true
            )"
            combined="${status_states},${check_states}"

            if grep -Eqi 'pending|queued|in_progress|requested|waiting' <<<"${combined}"; then
              echo pending
            elif grep -Eqi 'failure|error|cancelled|timed_out|action_required|startup_failure|stale' <<<"${combined}"; then
              echo failure
            elif grep -Eqi 'success' <<<"${combined}"; then
              echo success
            else
              echo missing
            fi
          }

          for attempt in $(seq 1 120); do
            state="$(vercel_state "${HEAD_SHA}")"
            echo "Preview attempt ${attempt}/120 — Vercel=${state}"
            [[ "${state}" == "success" ]] && exit 0
            [[ "${state}" == "failure" ]] && exit 1
            sleep 10
          done

          echo "Timed out waiting for the Vercel preview."
          exit 1

      - name: Confirm validated refs are unchanged
        shell: bash
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_BRANCH}" --jq '.object.sha')"
          current_head="$(gh pr view "${PR_URL}" --json headRefOid --jq '.headRefOid')"

          if [[ "${current_base}" != "${BASE_SHA}" ]]; then
            echo "Base changed from ${BASE_SHA} to ${current_base}; synchronize and validate again."
            exit 1
          fi
          if [[ "${current_head}" != "${HEAD_SHA}" ]]; then
            echo "Head changed from ${HEAD_SHA} to ${current_head}; validate the new commit first."
            exit 1
          fi

      - name: Squash and merge pull request
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_URL}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"

      - name: Verify production publication
        shell: bash
        run: |
          set -euo pipefail

          vercel_state() {
            local sha="$1"
            local status_states check_states combined
            status_states="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" \
                --jq '[.statuses[] | select(.context | test("vercel"; "i")) | .state] | unique | join(",")' \
                2>/dev/null || true
            )"
            check_states="$(
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
                --jq '[.check_runs[] | select(.name | test("vercel"; "i")) | if .status != "completed" then .status else (.conclusion // "missing") end] | unique | join(",")' \
                2>/dev/null || true
            )"
            combined="${status_states},${check_states}"

            if grep -Eqi 'pending|queued|in_progress|requested|waiting' <<<"${combined}"; then
              echo pending
            elif grep -Eqi 'failure|error|cancelled|timed_out|action_required|startup_failure|stale' <<<"${combined}"; then
              echo failure
            elif grep -Eqi 'success' <<<"${combined}"; then
              echo success
            else
              echo missing
            fi
          }

          article_path="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
              --jq '[.[] | select(.status == "added" and (.filename | startswith("content/articles/") and endswith(".mdx")))][0].filename // empty'
          )"
          [[ -n "${article_path}" ]] || { echo "No added article found in PR ${PR_NUMBER}."; exit 1; }
          slug="$(basename "${article_path}" .mdx)"

          merge_sha=""
          for attempt in $(seq 1 30); do
            merge_sha="$(gh pr view "${PR_URL}" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)"
            [[ -n "${merge_sha}" ]] && break
            echo "Merge commit not available yet (${attempt}/30)."
            sleep 2
          done
          [[ -n "${merge_sha}" ]] || { echo "Unable to resolve merge commit."; exit 1; }

          for attempt in $(seq 1 120); do
            state="$(vercel_state "${merge_sha}")"
            echo "Production attempt ${attempt}/120 — Vercel=${state}"
            [[ "${state}" == "success" ]] && break
            [[ "${state}" == "failure" ]] && exit 1
            [[ "${attempt}" -eq 120 ]] && { echo "Timed out waiting for production deployment."; exit 1; }
            sleep 10
          done

          site="${PRODUCTION_SITE%/}"
          page_file="$(mktemp)"
          header_file="$(mktemp)"
          sitemap_file="$(mktemp)"
          trap 'rm -f "${page_file}" "${header_file}" "${sitemap_file}"' EXIT

          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            "${site}/artigos/${slug}" --output "${page_file}"
          curl --fail --location --silent --show-error --head --retry 8 --retry-delay 5 --retry-all-errors \
            "${site}/images/articles/${slug}.webp" --output "${header_file}"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            "${site}/sitemap.xml" --output "${sitemap_file}"

          node - "${page_file}" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const linkTags = html.match(/<link\b[^>]*>/gi) ?? [];
          const hasCanonical = linkTags.some((tag) => /\brel\s*=\s*["']?canonical["']?/i.test(tag));
          const scriptTags = html.match(/<script\b[^>]*>/gi) ?? [];
          const hasJsonLd = scriptTags.some((tag) => /\btype\s*=\s*["']application\/ld\+json["']/i.test(tag));
          if (!hasCanonical) throw new Error("canonical link not found");
          if (!hasJsonLd) throw new Error("JSON-LD script not found");
          NODE

          grep -Eqi '^content-type:[[:space:]]*image/webp(?:;|[[:space:]]|$)' "${header_file}"
          grep -Fq "/artigos/${slug}" "${sitemap_file}"
          echo "Production verified for /artigos/${slug} at ${merge_sha}."
