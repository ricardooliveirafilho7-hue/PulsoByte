name: Automated content quality and merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Um grupo por PR: um push novo no MESMO PR substitui a validação anterior
# (o merge tem grupo próprio, serializado e sem cancelamento — ver abaixo).
concurrency:
  group: automated-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read

    steps:
      - name: Checkout synthetic pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan diff for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          node scripts/automation/check-secrets.mjs

      - name: Editorial guards (scope, identity, concurrency)
        if: startsWith(github.event.pull_request.head.ref, 'automation/artigo-')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/check-editorial-pr.mjs --scope --identity --concurrency

      - name: Run automated tests
        run: npm test

      - name: Validate editorial catalog
        run: npm run validate:catalog

      - name: Validate article content
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VALIDATE_SOURCE_AVAILABILITY: ${{ startsWith(github.event.pull_request.head.ref, 'automation/artigo-') && '1' || '' }}
        run: npm run validate:content

      - name: Validate article images
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npm run validate:images

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"

  auto-merge-automated-article:
    name: Auto-merge automated article
    needs: quality
    if: >-
      ${{
        needs.quality.result == 'success' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'automation/artigo-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serializa TODAS as integrações editoriais; nunca cancela um merge
    # saudável em andamento (cancel-in-progress: false).
    concurrency:
      group: automated-content-merge-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read

    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Confirm target is the default branch
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"

          if [[ "${BASE_BRANCH}" != "${default_branch}" ]]; then
            echo "Refusing auto-merge: PR targets '${BASE_BRANCH}', but default branch is '${default_branch}'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve production site
        env:
          PRODUCTION_SITE_VAR: ${{ vars.PRODUCTION_SITE }}
        run: |
          set -euo pipefail
          site="${PRODUCTION_SITE_VAR}"
          if [[ -z "${site}" ]]; then
            site="$(node -p "require('./automation/editorial-config.json').site.productionUrl")"
          fi
          echo "PRODUCTION_SITE=${site%/}" >> "${GITHUB_ENV}"
          echo "Production site: ${site%/}"

      - name: Wait for Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/vercel-state.sh

          for attempt in $(seq 1 120); do
            state="$(vercel_state "${HEAD_SHA}")"
            echo "Preview attempt ${attempt}/120 — Vercel=${state}"
            [[ "${state}" == "success" ]] && exit 0
            [[ "${state}" == "failure" ]] && { echo "Vercel preview failed for ${HEAD_SHA}."; exit 1; }
            sleep 10
          done

          echo "Timed out waiting for the Vercel preview."
          exit 1

      - name: Revalidate against current base (bounded)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          max="$(node -p "require('./automation/editorial-config.json').limits.maxBaseRevalidations")"
          validated_base="${BASE_SHA}"
          attempts=0

          while true; do
            current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_BRANCH}" --jq '.object.sha')"
            current_head="$(gh pr view "${PR_URL}" --json headRefOid --jq '.headRefOid')"

            if [[ "${current_head}" != "${HEAD_SHA}" ]]; then
              echo "MERGE_ABORTED_HEAD_CHANGED: head mudou de ${HEAD_SHA} para ${current_head}; o novo push dispara nova validação."
              exit 1
            fi

            if [[ "${current_base}" == "${validated_base}" ]]; then
              echo "Base ${current_base} confirmada; validação vigente."
              break
            fi

            if (( attempts >= max )); then
              echo "MERGE_ABORTED_REVALIDATION_EXHAUSTED: base mudou novamente (${validated_base} → ${current_base}) após ${attempts} revalidação(ões); limite ${max}. O PR permanece aberto para recuperação."
              exit 1
            fi

            attempts=$(( attempts + 1 ))
            echo "Base avançou de ${validated_base} para ${current_base}; revalidação ${attempts}/${max}."

            git fetch --no-tags origin "${current_base}" "${HEAD_SHA}"
            git checkout --detach "${current_base}"
            if ! git merge --no-ff --no-edit "${HEAD_SHA}"; then
              git merge --abort || true
              echo "MERGE_ABORTED_CONFLICT: conflito entre ${HEAD_SHA} e a base atual ${current_base}. Não resolvemos conflito editorial automaticamente; o PR permanece aberto."
              exit 1
            fi

            BASE_SHA="${current_base}" node scripts/automation/check-editorial-pr.mjs --scope --identity --concurrency
            npm test
            npm run validate:catalog
            GITHUB_HEAD_REF="${HEAD_BRANCH}" npm run validate:content
            GITHUB_HEAD_REF="${HEAD_BRANCH}" npm run validate:images
            npm run typecheck
            npm run lint
            npm run build
            git diff --check "${current_base}" "${HEAD_SHA}"

            validated_base="${current_base}"
          done

      - name: Squash and merge pull request
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_URL}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"

      - name: Verify production publication
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/vercel-state.sh

          article_path="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
              --jq '[.[] | select(.status == "added" and (.filename | startswith("content/articles/") and endswith(".mdx")))][0].filename // empty'
          )"
          [[ -n "${article_path}" ]] || { echo "No added article found in PR ${PR_NUMBER}."; exit 1; }
          slug="$(basename "${article_path}" .mdx)"

          merge_sha=""
          for attempt in $(seq 1 30); do
            merge_sha="$(gh pr view "${PR_URL}" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)"
            [[ -n "${merge_sha}" ]] && break
            echo "Merge commit not available yet (${attempt}/30)."
            sleep 2
          done
          [[ -n "${merge_sha}" ]] || { echo "Unable to resolve merge commit."; exit 1; }

          for attempt in $(seq 1 120); do
            state="$(vercel_state "${merge_sha}")"
            echo "Production attempt ${attempt}/120 — Vercel=${state}"
            [[ "${state}" == "success" ]] && break
            [[ "${state}" == "failure" ]] && { echo "Vercel production failed for ${merge_sha}."; exit 1; }
            [[ "${attempt}" -eq 120 ]] && { echo "Timed out waiting for production deployment."; exit 1; }
            sleep 10
          done

          # Smoke test com valores exatos, no checkout do commit integrado.
          git fetch --no-tags origin "${merge_sha}"
          git checkout --detach "${merge_sha}"
          node scripts/smoke-test-production.mjs --slug "${slug}" --site "${PRODUCTION_SITE}"
          echo "Production verified for /artigos/${slug} at ${merge_sha}."
